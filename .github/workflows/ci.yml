name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core-and-ios-build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Core unit tests
        run: swift test
      - name: Render all sound pairs for review
        run: swift run -c release SoundPreview build/sound-library
      - uses: actions/upload-artifact@v4
        with:
          name: offline-sound-library-86-options
          path: build/sound-library/
          retention-days: 14
      - name: Generate icon and verify project
        run: |
          python3 scripts/generate_assets.py
          python3 scripts/generate_project.py
          git diff --exit-code -- DuoSound.xcodeproj
      - name: Release preparation unit tests
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/release_check.py
      - name: Build release-mode preview for iOS simulator
        run: >-
          xcodebuild -project DuoSound.xcodeproj -scheme DuoSound
          -configuration Release -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Select available iPhone and iPad simulators
        id: simulator
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          data=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))
          phones=[dict(p, runtime=runtime) for runtime,group in data['devices'].items() for p in group if p['name'].startswith('iPhone') and p.get('isAvailable')]
          phones.sort(key=lambda p: ('Pro Max' in p['name'],p['name']),reverse=True)
          if not phones: raise SystemExit('No available iPhone simulator')
          tablets=[dict(p, runtime=runtime) for runtime,group in data['devices'].items() for p in group if p['name'].startswith('iPad') and p.get('isAvailable')]
          tablets.sort(key=lambda p: ('Air 11' in p['name'],p['name']),reverse=True)
          if not tablets: raise SystemExit('No available iPad simulator')
          # Precreated image devices can stall indefinitely waiting for BackBoard.
          # Keep the same selected device/OS coverage but give each job fresh data.
          for key,name,device in [('udid','Hingy iPhone QA',phones[0]),('ipad_udid','Hingy iPad QA',tablets[0])]:
              udid=subprocess.check_output(['xcrun','simctl','create',name,device['deviceTypeIdentifier'],device['runtime']],text=True).strip()
              with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write(key+'='+udid+'\n')
          print('QA simulator:',phones[0]['name'])
          print('iPad QA simulator:',tablets[0]['name'])
          PY
      - name: UI smoke tests and actual preview screenshots
        timeout-minutes: 15
        run: |
          python3 -c "import subprocess; subprocess.run(['xcrun','simctl','bootstatus','${{ steps.simulator.outputs.udid }}','-b'],check=True,timeout=180)"
          mkdir -p TestResults
          set -o pipefail
          xcodebuild -project DuoSound.xcodeproj -scheme DuoSound -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -derivedDataPath DerivedData -resultBundlePath TestResults/DuoSound.xcresult \
            -parallel-testing-enabled NO -collect-test-diagnostics never \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 300 \
            CODE_SIGNING_ALLOWED=NO test | tee TestResults/iphone-tests.log
      - name: Export screenshot attachments
        if: always()
        run: |
          if [ -d TestResults/DuoSound.xcresult ]; then
            xcrun xcresulttool export attachments --path TestResults/DuoSound.xcresult --output-path TestResults/Attachments
          fi
      - name: iPad audio regression and UI tests
        if: ${{ !cancelled() && steps.simulator.outcome == 'success' }}
        timeout-minutes: 15
        run: |
          python3 -c "import subprocess; subprocess.run(['xcrun','simctl','bootstatus','${{ steps.simulator.outputs.ipad_udid }}','-b'],check=True,timeout=180)"
          mkdir -p TestResults
          set -o pipefail
          xcodebuild -project DuoSound.xcodeproj -scheme DuoSound -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.ipad_udid }}' \
            -derivedDataPath DerivedData -resultBundlePath TestResults/Hingy-iPad.xcresult \
            -parallel-testing-enabled NO -collect-test-diagnostics never \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 300 \
            CODE_SIGNING_ALLOWED=NO test | tee TestResults/ipad-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-ui-tests-not-hardware-validation
          path: TestResults/
          if-no-files-found: ignore
          retention-days: 14
