name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core-and-ios-build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Core unit tests
        run: swift test
      - name: Generate icon and verify project
        run: |
          python3 scripts/generate_assets.py
          python3 scripts/generate_project.py
          git diff --exit-code -- DuoSound.xcodeproj
      - name: Release preparation unit tests
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/release_check.py
      - name: Build release-mode preview for iOS simulator
        run: >-
          xcodebuild -project DuoSound.xcodeproj -scheme DuoSound
          -configuration Release -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Select available iPhone simulator
        id: simulator
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          data=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))
          phones=[p for group in data['devices'].values() for p in group if p['name'].startswith('iPhone') and p.get('isAvailable')]
          phones.sort(key=lambda p: ('Pro Max' in p['name'],p['name']),reverse=True)
          if not phones: raise SystemExit('No available iPhone simulator')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('udid='+phones[0]['udid']+'\n')
          print('QA simulator:',phones[0]['name'])
          PY
      - name: UI smoke tests and actual preview screenshots
        run: |
          xcrun simctl bootstatus '${{ steps.simulator.outputs.udid }}' -b
          xcodebuild -project DuoSound.xcodeproj -scheme DuoSound -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -derivedDataPath DerivedData -resultBundlePath TestResults/DuoSound.xcresult \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test
      - name: Export screenshot attachments
        if: always()
        run: |
          if [ -d TestResults/DuoSound.xcresult ]; then
            xcrun xcresulttool export attachments --path TestResults/DuoSound.xcresult --output-path TestResults/Attachments
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-ui-tests-not-hardware-validation
          path: TestResults/
          if-no-files-found: ignore
          retention-days: 14
